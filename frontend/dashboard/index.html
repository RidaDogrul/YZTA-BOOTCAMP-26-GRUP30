<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapor Dashboard — Nexus Analytics</title>

  <!-- Grafik + PDF + Excel kütüphaneleri (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0d0f1a; color: #e2e8f0; padding: 24px;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .topbar h1 { font-size: 20px; }
    .topbar a { color: #94a3b8; text-decoration: none; font-size: 14px; }

    /* Filtre çubuğu */
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filters input, .filters select {
      background: #1a1d2e; border: 1px solid #2d3348; color: #e2e8f0;
      padding: 10px 14px; border-radius: 8px; font-size: 14px;
    }
    .filters input { flex: 1; min-width: 200px; }

    /* Rapor kartları */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card {
      background: #161927; border: 1px solid #262b3d; border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; gap: 10px;
    }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-meta { font-size: 12px; color: #8b93a7; display: flex; gap: 10px; }
    .badge { background: #6366f1; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
    .card-summary { font-size: 13px; color: #b6bdcc; line-height: 1.5; max-height: 60px; overflow: hidden; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px;
      cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-view { background: #334155; }
    .btn-pdf { background: #ef4444; }
    .btn-excel { background: #22c55e; }
    .btn-mail { background: #6366f1; }
    .btn:hover { opacity: .9; }

    /* Mail giriş kutusu (karttaki) */
    .mail-box { display: none; gap: 8px; margin-top: 8px; }
    .mail-box.open { display: flex; }
    .mail-box input { flex: 1; background: #1a1d2e; border: 1px solid #2d3348; color: #e2e8f0; padding: 8px; border-radius: 6px; }

    .empty { text-align: center; color: #64748b; padding: 60px 0; }

    /* Detay modalı */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
      align-items: center; justify-content: center; padding: 24px; z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #161927; border: 1px solid #262b3d; border-radius: 14px;
      max-width: 760px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 28px;
    }
    .modal h2 { margin-bottom: 6px; }
    .modal .section { margin-top: 20px; }
    .modal .section h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
    .modal pre { background: #0d0f1a; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    .modal ul { padding-left: 20px; }
    .modal-close { float: right; cursor: pointer; color: #94a3b8; font-size: 22px; background: none; border: none; }

    /* Toast */
    #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
    .toast { background: #1a1d2e; border: 1px solid #2d3348; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
    .toast.success { border-color: #22c55e; }
    .toast.error { border-color: #ef4444; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📊 Rapor Dashboard</h1>
    <a href="../chat/index.html">← Analize Dön</a>
  </div>

  <!-- Filtreler -->
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Başlık veya özette ara..." />
    <select id="sourceFilter">
      <option value="">Tüm kaynaklar</option>
      <option value="postgresql">PostgreSQL</option>
      <option value="mysql">MySQL</option>
      <option value="mongodb">MongoDB</option>
      <option value="s3">S3</option>
      <option value="snowflake">Snowflake</option>
    </select>
  </div>

  <!-- Rapor kartları buraya JS ile gelecek -->
  <div class="grid" id="reportGrid"></div>
  <div class="empty" id="emptyState" style="display:none">Henüz rapor yok. Önce sohbette bir analiz yapın.</div>

  <!-- Detay modalı -->
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toast alanı -->
  <div id="toasts"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
